name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python EngineerOS/scripts/validate_repository.py
      - name: Run authoritative sample-project tests
        working-directory: Sample-Projects/commerce-risk
        run: python -m unittest discover -s tests -v
